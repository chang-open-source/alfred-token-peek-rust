name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (automatically calculated from current version)'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Build and validate only; do not push a commit/tag or publish'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BUMP: ${{ inputs.bump }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Calculate release version
        run: |
          version=$(python3 scripts/release.py next-version --bump "$RELEASE_BUMP")
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Release: v$version ($RELEASE_BUMP)" >> "$GITHUB_STEP_SUMMARY"
      - name: Check version and remote tag
        run: |
          python3 - <<'PY'
          import os, sys, tomllib
          sys.path.insert(0, 'scripts')
          from release import validate_next_version
          validate_next_version(os.environ['RELEASE_VERSION'], tomllib.load(open('Cargo.toml','rb'))['package']['version'])
          PY
          test -z "$(git ls-remote --tags origin "refs/tags/v$RELEASE_VERSION")"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          tags=Path(os.environ['RUNNER_TEMP'],'release-tags').read_text().splitlines()
          if 'v'+os.environ['RELEASE_VERSION'] in tags:
              raise SystemExit('Release already exists; use the documented recovery procedure')
          PYCODE
          echo "RELEASE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Test release tooling
        run: python3 -m unittest discover -s tests/release -v
      - name: Resolve and prepare release
        run: python3 scripts/release.py prepare --version "$RELEASE_VERSION"
      - name: Test and build
        run: |
          cargo test --locked
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo fetch --locked
          python3 scripts/package.py
          python3 scripts/verify_package.py
          git diff --check
      - name: Save release preparation for recovery
        run: |
          git diff --binary > dist/release-preparation.patch
          git rev-parse HEAD > dist/BASE_COMMIT
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ env.RELEASE_VERSION }}
          if-no-files-found: error
          path: |
            dist/alfred-token-peek.alfredworkflow
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
            dist/release-preparation.patch
            dist/BASE_COMMIT
      - name: Commit and tag verified release
        if: ${{ !inputs.dry_run }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_BASE"
          test -z "$(git ls-remote --tags origin "refs/tags/v$RELEASE_VERSION")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock workflow/info.plist README.md README.zh.md CHANGELOG.md vendor/manifest.json vendor/CodexBar-LICENSE
          git commit -m "Release v$RELEASE_VERSION"
          git tag -a "v$RELEASE_VERSION" -m "Release v$RELEASE_VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$RELEASE_VERSION"
      - name: Publish release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "v$RELEASE_VERSION" dist/alfred-token-peek.alfredworkflow dist/SHA256SUMS \
            --verify-tag --title "Token Peek v$RELEASE_VERSION" --notes-file dist/RELEASE_NOTES.md --draft
          gh release edit "v$RELEASE_VERSION" --draft=false
