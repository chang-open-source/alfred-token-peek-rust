[package]
name = "token-peek"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Alfred usage workflow powered by bundled CodexBar CLI"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
libc = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
